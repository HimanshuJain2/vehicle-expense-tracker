plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.example.vehicleexpensetracker"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.vehicleexpensetracker"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "FRONTEND_URL", "\"http://10.0.2.2:3000/login.html\""
    }

    buildFeatures {
        buildConfig true
    }
}
