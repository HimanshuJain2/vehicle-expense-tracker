<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Vehicle | Motofy</title>
    <link rel="icon" href="./assets/motofy-mark.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img class="logo" src="./assets/motofy-mark.svg" alt="" />
          <div>
            <h1>Motofy</h1>
            <p id="userEmail" class="muted"></p>
          </div>
        </div>
        <button id="logoutButton" class="button ghost-button" type="button">Logout</button>
      </header>

      <main>
        <p id="pageMessage" class="message"></p>
        <section class="page-intro">
          <p class="eyebrow">Garage setup</p>
          <h2>Add or manage a vehicle</h2>
          <p class="muted">Keep each car, bike, scooter, or truck ready for accurate cost tracking.</p>
        </section>

        <section id="vehicleFormPanel" class="panel">
          <form id="vehicleForm">
            <input name="vehicleId" type="hidden" />
            <label>
              Vehicle name
              <input name="vehicleName" placeholder="Honda City" required />
            </label>
            <label>
              Registration number
              <input name="number" placeholder="DL 01 AB 1234" required />
            </label>
            <label>
              Vehicle type
              <select name="type" required>
                <option value="car">Car</option>
                <option value="bike">Bike</option>
                <option value="scooter">Scooter</option>
                <option value="truck">Truck</option>
                <option value="other">Other</option>
              </select>
            </label>
            <label>
              Initial odometer reading
              <input name="initialOdometer" type="number" min="0" step="0.1" placeholder="40000" />
            </label>
            <div class="form-actions">
              <button id="vehicleSubmitButton" class="button" type="submit">Save vehicle</button>
              <button id="cancelVehicleEditButton" class="button ghost-button is-hidden" type="button">Cancel edit</button>
              <a class="button ghost-button" href="dashboard.html">Back to dashboard</a>
            </div>
            <p id="formMessage" class="message"></p>
          </form>
        </section>

        <section class="panel">
          <div class="section-heading">
            <h2>Your vehicles</h2>
            <button id="showVehicleFormButton" class="button ghost-button compact-button is-hidden" type="button">
              Add vehicle
            </button>
          </div>
          <section id="vehicleDetailPanel" class="detail-panel is-hidden" aria-label="Vehicle detail">
            <div class="detail-header">
              <div>
                <p class="muted">Vehicle detail</p>
                <h2 id="vehicleDetailTitle"></h2>
              </div>
              <div class="detail-actions">
                <button class="icon-button" data-detail-action="edit-vehicle" type="button" aria-label="Edit vehicle">✎</button>
                <button class="icon-button danger" data-detail-action="delete-vehicle" type="button" aria-label="Delete vehicle">×</button>
                <button class="icon-button" data-detail-action="close-vehicle" type="button" aria-label="Close vehicle detail">⌄</button>
              </div>
            </div>
            <div id="vehicleDetailBody" class="detail-grid"></div>
          </section>
          <div id="vehicleList" class="vehicle-list"></div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <a data-nav href="dashboard.html">Dashboard</a>
        <a data-nav href="add-expense.html">Expense</a>
        <a data-nav href="add-vehicle.html">Vehicle</a>
      </nav>
    </div>

    <script type="module" src="./js/addVehicle.js"></script>
  </body>
</html>
