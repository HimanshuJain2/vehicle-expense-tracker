      <stop offset="1" stop-color="#fef3c7" stop-opacity="0.86" />
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#banner-bg)" />
  <path d="M-20 288 C190 198 351 314 574 228 C777 150 912 70 1220 120" fill="none" stroke="url(#road)" stroke-width="34" stroke-linecap="round" opacity="0.92" />
