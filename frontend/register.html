<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Motofy</title>
    <link rel="icon" href="./assets/motofy-mark.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="auth-page">
    <section class="auth-card">
      <div class="brand">
        <img class="logo" src="./assets/motofy-mark.svg" alt="" />
        <div>
          <h1>Join Motofy</h1>
          <p class="muted">Mileage, spend, and service in rhythm.</p>
        </div>
      </div>

      <form data-auth-form data-mode="register">
        <label>
          Email
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="new-password" minlength="6" required />
        </label>
        <button class="button" type="submit">Sign up</button>
        <div class="auth-divider"><span>or</span></div>
        <button class="button google-button" data-google-auth type="button">
          <span class="google-mark" aria-hidden="true">G</span>
          Sign up with Google
        </button>
        <p id="formMessage" class="message"></p>
      </form>

      <p class="muted">Already registered? <a href="login.html">Log in</a></p>
    </section>

    <script type="module" src="./js/auth.js"></script>
  </body>
</html>
